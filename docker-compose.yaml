name: CompareAPI

networks:
  app-tier:
    driver: bridge
services:
  db:
    image: bitnami/postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_EXPORT_PORT}:${DB_INTERNAL_PORT}" # externa/interna
      
    volumes:
      - postgres_data:/bitnami/postgresql
  storage:
    restart: unless-stopped
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${DB_USERNAME}
      MINIO_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio
    

  cache:
    image: bitnami/redis:latest
    restart: unless-stopped
    networks:
      - app-tier
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${REDIS_PORT}:6379"
    
  # CompareAPI: 
  #   image: OUR IMAGE (WHEN DEPLOY)
  #   networks:
  #     - app-tier


volumes:
  postgres_data:
  minio_data: